name: Check and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Test calculations and database rules
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile interactions
        run: npm run test:browser
        env:
          TEST_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - name: Build connected application
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Set the NEXT_PUBLIC_SUPABASE_URL repository variable.'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Set the NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository variable.'; exit 1; }
          npm run build
          touch out/.nojekyll
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
